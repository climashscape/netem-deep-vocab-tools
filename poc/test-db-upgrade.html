<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB v8 Upgrade Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { background: #000; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warn { color: #ff0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>DB v8 Upgrade Test</h1>
    <button onclick="testUpgrade()">Test DB v8 Upgrade</button>
    <button onclick="checkData()">Check Data</button>
    <button onclick="testExport()">Test Export Function</button>
    <button onclick="deleteDB()">Delete DB</button>
    <div class="log" id="log"></div>
    
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
    <script>
        const logEl = document.getElementById('log');
        
        function log(msg, type = 'info') {
            const color = type === 'error' ? '#f00' : type === 'warn' ? '#ff0' : '#0f0';
            logEl.innerHTML += `<div style="color:${color}">[${new Date().toISOString().split('T')[1]}] ${msg}</div>`;
        }
        
        async function testUpgrade() {
            log('Starting DB v8 upgrade test...');
            
            try {
                const db = new Dexie("NetemVocabDB");
                
                // Version 7
                db.version(7).stores({
                    explanations: '[mode+query_key], mode, query_key, created_at',
                    learning_progress: 'verb, stage, last_review, next_review, status',
                    checkins: 'date',
                    learn_batch: 'verb',
                    verbs: 'word, frequency, pos, original_word',
                    extra_vocabulary: 'word, definition, created_at'
                });
                
                // Version 8
                db.version(8).stores({
                    learning_progress: 'verb, stage, last_review, next_review, status, [status+next_review]'
                }).upgrade(tx => {
                    log('DB upgraded to v8!', 'success');
                });
                
                await db.open();
                log('DB opened successfully!', 'success');
                log(`Current version: ${db.verno}`);
                
                // Test index query
                const count = await db.learning_progress.count();
                log(`learning_progress count: ${count}`);
                
                // Test compound index
                try {
                    const now = new Date().toISOString();
                    const results = await db.learning_progress
                        .where('[status+next_review]')
                        .between(['learning', ''], ['learning', now], true, true)
                        .and(item => item.status === 'learning')
                        .toArray();
                    log(`Index query returned ${results.length} results`, 'success');
                } catch (e) {
                    log(`Index query failed: ${e.message}`, 'warn');
                }
                
                db.close();
                
            } catch (e) {
                log(`ERROR: ${e.message}`, 'error');
                console.error(e);
            }
        }
        
        async function checkData() {
            log('Checking existing data...');
            
            try {
                const db = new Dexie("NetemVocabDB");
                db.version(8).stores({
                    explanations: '[mode+query_key], mode, query_key, created_at',
                    learning_progress: 'verb, stage, last_review, next_review, status, [status+next_review]',
                    checkins: 'date',
                    learn_batch: 'verb',
                    verbs: 'word, frequency, pos, original_word',
                    extra_vocabulary: 'word, definition, created_at'
                });
                
                await db.open();
                
                const progress = await db.learning_progress.toArray();
                log(`learning_progress: ${progress.length} records`);
                
                const explanations = await db.explanations.toArray();
                log(`explanations: ${explanations.length} records`);
                
                db.close();
                
            } catch (e) {
                log(`ERROR: ${e.message}`, 'error');
            }
        }
        
        async function testExport() {
            log('Testing export function...');
            
            try {
                const db = new Dexie("NetemVocabDB");
                db.version(8).stores({
                    explanations: '[mode+query_key], mode, query_key, created_at',
                    learning_progress: 'verb, stage, last_review, next_review, status, [status+next_review]',
                    checkins: 'date',
                    learn_batch: 'verb',
                    verbs: 'word, frequency, pos, original_word',
                    extra_vocabulary: 'word, definition, created_at'
                });
                
                await db.open();
                
                // Simulate export
                const data = {
                    explanations: await db.explanations.toArray(),
                    learning_progress: await db.learning_progress.toArray(),
                    checkins: await db.checkins.toArray(),
                    extra_vocabulary: await db.extra_vocabulary.toArray()
                };
                
                log(`Export data prepared: ${JSON.stringify(data).length} bytes`, 'success');
                
                db.close();
                
            } catch (e) {
                log(`ERROR: ${e.message}`, 'error');
            }
        }
        
        async function deleteDB() {
            log('Deleting DB...');
            await Dexie.delete("NetemVocabDB");
            log('DB deleted!', 'success');
        }
    </script>
</body>
</html>
